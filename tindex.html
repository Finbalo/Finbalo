<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind coHOMES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwindcss -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/x-icon" href="./images/logo.png" />
  </head>
  <body class="font-['Lato'] font-[700] text-[16px]">
    <section class="bg-[url(./images/hero-bg.png)] bg-cover bg-center h-screen">
      <div class="h-screen bg-[#00000080]">
        <nav class="py-[10px] px-[80px] flex justify-between items-center">
          <div>
            <a href="#"><img src="./images/logo.png" alt="logo" /></a>
          </div>
          <div class="flex gap-[100px] items-center">
            <div>
              <ul class="flex justify-center gap-[30px] items-center text-[#FFFFFF]">
                <li><a href="">Home</a></li>
                <li><a href="">Properties</a></li>
                <li><a href="">Find Roommates</a></li>
                <li><a href="">Explore</a></li>
                <li><a href="">Blog</a></li>
              </ul>
            </div>
            <div class="flex gap-[30px] text-[#FFFFFF]">
              <a href="#" class="py-[5px] px-[30px] rounded-[5px] bg-[#c4c4c42b] border-[1px] border-solid border-[#FFFFFF]">Login</a>
              <a href="#" class="py-[5px] px-[30px] rounded-[5px] bg-[#d32323] font-[900]">Register</a>
            </div>
          </div>
        </nav>
        <div class="mt-[50px] p-[80px] text-[#FFFFFF] w-full">
          <h1 class="text-[40px] leading-[50px]">Elegant Villa In <br />Wuse 2</h1>
          <p class="pt-[5px] text-[18px]">3 BD | 3 BA</p>
          <div class="pt-[30px] flex gap-[20px]">
            <img class="rounded-[2px] h-[90px]" src="./images/hero-c1.png" alt="" />
            <img class="rounded-[2px] h-[90px]" src="./images/hero-c2.png" alt="" />
            <img class="rounded-[2px] h-[90px]" src="./images/hero-c3.png" alt="" />
          </div>
          <div class="flex justify-center items-center mt-[50px]">
            <p class="mt-[30px]">
              <span class="py-[40px] px-[60px] bg-[#f6f8fa] text-[#000000] text-[18px] text-center">Rent</span><span class="py-[40px] px-[60px] bg-[#d32323] text-[#FFFFFF] text-[18px] text-center">Buy</span
              ><span class="p-[40px] bg-[#f6f8fa] text-[#000000] text-[18px] text-center">Roommate</span>
            </p>
          </div>
        </div>
        <div class="">
          <p>
            Location
            <span class="dropdown-container"
              ><span class="dropdown-icon" onclick="toggleDropdownMenu(event)"
                ><img src="./images/dropdown.png" alt="dropdown" /><span
                  class="current-option"
                  >Abuja</span
                ></span
              ><span class="dropdown-menu" id="dropdownMenu"
                ><span
                  class="dropdown-item"
                  onclick="selectOption(event, 'Abuja')"
                  >Abuja</span
                ><span
                  class="dropdown-item"
                  onclick="selectOption(event, 'Lagos')"
                  >Lagos</span
                ><span
                  class="dropdown-item"
                  onclick="selectOption(event, 'Delta')"
                  >Delta</span
                ><span
                  class="dropdown-item"
                  onclick="selectOption(event, 'Anambra')"
                  >Anambra</span
                ></span
              ></span
            >
          </p>
          <p>
            Property type
            <span class="dropdown-container"
              ><span class="dropdown-icon" onclick="toggleDropdownMenu(event)"
                ><img src="./images/dropdown.png" alt="dropdown" /><span
                  class="current-option"
                  >Condo</span
                ></span
              ><span class="dropdown-menu" id="dropdownMenu"
                ><span
                  class="dropdown-item"
                  onclick="selectOption(event, 'Condo')"
                  >Condo</span
                ><span
                  class="dropdown-item"
                  onclick="selectOption(event, 'Apartment')"
                  >Apartment</span
                ><span
                  class="dropdown-item"
                  onclick="selectOption(event, 'Flat')"
                  >Flat</span
                ></span
              >
            </span>
          </p>
          <p>
            Bedroom
            <span class="dropdown-container"
              ><span class="dropdown-icon" onclick="toggleDropdownMenu(event)"
                ><img src="./images/dropdown.png" alt="dropdown" /><span
                  class="current-option"
                  >2</span
                ></span
              ><span class="dropdown-menu" id="dropdownMenu"
                ><span class="dropdown-item" onclick="selectOption(event, '2')"
                  >2</span
                ><span class="dropdown-item" onclick="selectOption(event, '3')"
                  >3</span
                ><span class="dropdown-item" onclick="selectOption(event, '4')"
                  >4</span
                ><span class="dropdown-item" onclick="selectOption(event, '5')"
                  >5</span
                ><span class="dropdown-item" onclick="selectOption(event, '1')"
                  >1</span
                ></span
              ></span
            >
          </p>
          <p>
            Max Price
            <span class="dropdown-container"
              ><span class="dropdown-icon" onclick="toggleDropdownMenu(event)"
                ><img src="./images/dropdown.png" alt="dropdown" /><span
                  class="current-option"
                  >$250,000</span
                ></span
              ><span class="dropdown-menu" id="dropdownMenu"
                ><span
                  class="dropdown-item"
                  onclick="selectOption(event, '$250,000')"
                  >$250,000</span
                ><span
                  class="dropdown-item"
                  onclick="selectOption(event, '$50,000')"
                  >$50,000</span
                ><span
                  class="dropdown-item"
                  onclick="selectOption(event, '$150,000')"
                  >$150,000</span
                ><span
                  class="dropdown-item"
                  onclick="selectOption(event, '$350,000')"
                  >$350,000</span
                ><span
                  class="dropdown-item"
                  onclick="selectOption(event, '$650,000')"
                  >$650,000</span
                ></span
              ></span
            >
          </p>
          <a href="#"><img src="./images/search.png" alt="search" /></a>
        </div>
      </div>
    </section>
    <!-- <script src="./script.js"></script> -->
  </body>
</html>
