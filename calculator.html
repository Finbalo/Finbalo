<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/output.css" />
    <title>Calculator</title>
  </head>
  <body class="h-fit relative bg-[#f0ecec]">
    <div
      class="relative h-[95vh] bg-[#000000] my-4 w-[90%] mx-auto border-solid border-[5px] border-[#b1afafe0] rounded-[50px] p-4"
    >
      <div
        class="h-[33%] flex flex-col justify-end items-end text-[#ffffff] leading-11 mb-4"
      >
        <p class="text-[22px] text-[#a8a7a7] lg:text-[30px]">8×2</p>
        <p class="text-[50px] lg:text-[70px]">16</p>
      </div>
      <div
        class="h-[65%] grid grid-cols-4 grid-rows-5 gap-2 pb-[20px]"
      >
        <div
          class="bg-[#575656] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p>AC</p>
        </div>
        <div
          class="bg-[#575656] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p><sup>+</sup>/<sub>-</sub></p>
        </div>
        <div
          class="bg-[#575656] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p>%</p>
        </div>
        <div
          class="bg-[orange] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p class="lg:text-[40px]">÷</p>
        </div>
        <div
          class="bg-[#292828] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p>7</p>
        </div>
        <div
          class="bg-[#292828] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p>8</p>
        </div>
        <div
          class="bg-[#292828] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p>9</p>
        </div>
        <div
          class="bg-[orange] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p class="lg:text-[40px]">×</p>
        </div>
        <div
          class="bg-[#292828] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p>4</p>
        </div>
        <div
          class="bg-[#292828] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p>5</p>
        </div>
        <div
          class="bg-[#292828] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p>6</p>
        </div>
        <div
          class="bg-[orange] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p class="lg:text-[40px]">-</p>
        </div>
        <div
          class="bg-[#292828] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p>1</p>
        </div>
        <div
          class="bg-[#292828] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p>2</p>
        </div>
        <div
          class="bg-[#292828] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p>3</p>
        </div>
        <div
          class="bg-[orange] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p class="lg:text-[40px]">+</p>
        </div>
        <div
          class="bg-[#292828] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p><img src="./images/calculator.png" alt=""></p>
        </div>
        <div
          class="bg-[#292828] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p>0</p>
        </div>
        <div
          class="bg-[#292828] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p class="lg:text-[40px]">.</p>
        </div>
        <div
          class="bg-[orange] rounded-full flex justify-center items-center text-[30px] text-[#ffffff]"
        >
          <p class="lg:text-[40px]">=</p>
        </div>
      </div>
      <div class="h-[1%] flex justify-center items-center bg-[#fff] w-[50%] my-0 mx-auto rounded-2xl mb-[5px] lg:w-[30%]"></div>
    </div>
  </body>
</html>
